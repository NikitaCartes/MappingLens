ktor {
    deployment {
        host = "0.0.0.0"
        host = ${?HOST}
        port = 8080
        port = ${?PORT}
    }
}

mappinglens {
    database {
        path = "data/mappinglens.db"
        path = ${?MAPPINGLENS_DB_PATH}
    }
    sources {
        artifact-store = "data/artifact-store"
        artifact-store = ${?MAPPINGLENS_ARTIFACT_STORE}
        yarn-repo = "data/yarn"
        yarn-repo = ${?MAPPINGLENS_YARN_REPO}
        mojmap-repo = "data/mojmap"
        mojmap-repo = ${?MAPPINGLENS_MOJMAP_REPO}
        intermediary-mappings = "data/intermediary"
        intermediary-mappings = ${?MAPPINGLENS_INTERMEDIARY}
        # Intermediary for Mojang's unobfuscated releases (after 1.21.11); a separate repository.
        unobfuscated-intermediary-mappings = ""
        unobfuscated-intermediary-mappings = ${?MAPPINGLENS_UNOBFUSCATED_INTERMEDIARY}
    }
    indexing {
        # if empty, all discovered versions will be indexed
        initial-versions = []
        # Mapping namespaces the indexer reads: "yarn", "mojmap" or both, comma separated.
        # Intermediary is always read.
        mappings = "yarn,mojmap"
        mappings = ${?MAPPINGS}
        # true indexes Mojang's stable releases only. Snapshots, pre-releases, release candidates,
        # April Fools versions, combat snapshots and _unobfuscated variants are left out.
        only-releases = false
        only-releases = ${?ONLY_RELEASES}
    }
    search {
        max-results = 200
        default-results = 50
    }
    # How many entries the server keeps in memory between requests. Every one of these caches is
    # keyed on a version, so it grows with the number of versions a client walks over. The counts
    # differ because the entries do: a reference index is 34 to 61 MB, a resolved jar path is bytes.
    # Raise a count to trade heap for the work of rebuilding an entry. The defaults suit -Xmx4g.
    cache {
        # Reverse-reference indexes scanned out of a jar, 34 to 61 MB each.
        reference-indexes = 8
        reference-indexes = ${?CACHE_REFERENCE_INDEXES}
        # Declaration graphs scanned out of a jar, 10 to 19 MB each. Only versions the declaration
        # index does not cover reach this cache, so a complete index leaves it empty.
        declarations = 4
        declarations = ${?CACHE_DECLARATIONS}
        # Obfuscated-to-named maps read out of the index, 17 to 32 MB per version and namespace.
        name-maps = 4
        name-maps = ${?CACHE_NAME_MAPS}
        # JavaParser symbol solvers, which hold one open jar handle per library of the version.
        # This count does not bound the heap. A solver starts at 12 MB and grows as it resolves
        # classes, to 57 MB after 240 of them, and eviction returns none of it: JavaParser keeps
        # every solver in a static map that never releases an entry. See CacheConfig.kt.
        symbol-solvers = 4
        symbol-solvers = ${?CACHE_SYMBOL_SOLVERS}
        # Resolved token lists, one per version, class and namespace, each holding the class source.
        # 40 KB for an average class and 970 KB for one of the largest, so this count is worth 20 MB
        # of heap for ordinary browsing and 474 MB in the worst case a client can reach.
        tokens = 500
        tokens = ${?CACHE_TOKENS}
        # Resolved jar paths and library jar lists, one per version.
        paths = 2000
        paths = ${?CACHE_PATHS}
    }
    resources {
        # A clone of https://github.com/misode/mcmeta. Empty disables the resource explorer.
        # Build its index with: mappinglens index-resources
        repo = ""
        repo = ${?MAPPINGLENS_MCMETA_REPO}
    }
}

logging {
    level = "INFO"
}
