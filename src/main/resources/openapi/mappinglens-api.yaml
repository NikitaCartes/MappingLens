openapi: 3.1.0
info:
  title: MappingLens API
  description: Search, index, diff, translate and inspect Minecraft mappings across Yarn, Mojmap and Intermediary namespaces.
  version: 0.1.0
servers:
  - url: http://localhost:8080
tags:
  - name: Versions
  - name: Search
  - name: Diff
  - name: Translation
  - name: Bytecode
  - name: Compare
  - name: History
  - name: BodyHash
  - name: Hierarchy
  - name: References
  - name: Exists
  - name: Validate
  - name: Docs
paths:
  /api/v1/versions:
    get:
      tags: [Versions]
      summary: List all indexed versions
      description: >
        Variants (`<id>_unobfuscated`, a second indexing of a build already listed under its own id)
        are left out unless `includeVariants` is set. `variantOf` names the build a variant
        re-indexes, and is null on a version in its own right.
      parameters:
        - $ref: "#/components/parameters/IncludeVariants"
      responses:
        "200":
          description: Indexed versions with aggregate counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionListResponse"
  /api/v1/versions/{version}:
    get:
      tags: [Versions]
      summary: Get info about a specific indexed version
      parameters:
        - $ref: "#/components/parameters/VersionPath"
      responses:
        "200":
          description: Version metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/search:
    get:
      tags: [Search]
      summary: Search classes, methods and fields by mapping names
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            minLength: 1
        - in: query
          name: version
          schema:
            type: string
          description: Defaults to the latest indexed release.
        - in: query
          name: type
          schema:
            $ref: "#/components/schemas/SearchType"
          description: Element type filter.
        - in: query
          name: namespace
          schema:
            $ref: "#/components/schemas/SearchNamespace"
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: exact
          schema:
            type: boolean
            default: false
        - in: query
          name: includeSynthetic
          description: >
            Include javac lambda bodies (`lambda$addRecipes$0`), which the mappings name like any
            other method. Left out by default: a search for `addRecipes` means the method, and the
            index in a lambda's name moves between versions. Rows that are kept carry `synthetic`.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Search results ordered by FTS rank.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/diff:
    get:
      tags: [Diff]
      summary: Diff mappings between two versions
      parameters:
        - in: query
          name: from
          required: true
          schema:
            type: string
        - in: query
          name: to
          required: true
          schema:
            type: string
        - in: query
          name: namespace
          schema:
            $ref: "#/components/schemas/MappingNamespace"
        - in: query
          name: type
          schema:
            $ref: "#/components/schemas/SearchType"
        - in: query
          name: package
          schema:
            type: string
          description: >
            Package prefix filter, read in `namespace`: `net/minecraft/world/level/block`
            for mojmap, `net/minecraft/block` for yarn.
        - in: query
          name: class
          schema:
            type: string
          description: >
            Diff exactly one class (internal name in `namespace`, e.g.
            `net/minecraft/world/entity/Entity`), listing added/removed/renamed members by name.
            Unlike `package=` (a package-path prefix), this targets a single class; its summary
            counts match `/diff/files` for the same class. Takes precedence over `package`.
        - in: query
          name: changeType
          schema:
            type: string
            enum: [added, removed, renamed, all]
            default: all
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 100
      responses:
        "200":
          description: Added, removed and renamed mapping elements.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiffResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/diff/files:
    get:
      tags: [Diff]
      summary: Diff indexed source files between two versions
      parameters:
        - in: query
          name: from
          required: true
          schema:
            type: string
        - in: query
          name: to
          required: true
          schema:
            type: string
        - in: query
          name: namespace
          schema:
            type: string
            enum: [yarn, mojmap]
            default: mojmap
        - in: query
          name: path
          schema:
            type: string
          description: Relative source path prefix.
        - in: query
          name: file
          schema:
            type: string
          description: Exact or prefix source path filter. Takes precedence over `path`.
        - in: query
          name: function
          schema:
            type: string
          description: Optional method/function name filter used when `format=patch`.
        - in: query
          name: context
          schema:
            type: integer
            minimum: 0
            maximum: 20
            default: 3
          description: Number of context lines per hunk when `format=patch`.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50000
            default: 5000
          description: Maximum files included when `format=patch`.
        - in: query
          name: ignoreWhitespace
          schema:
            type: boolean
            default: false
          description: >
            When `format=patch`/`git`, collapse hunks that differ only in whitespace, line breaks
            or reindentation (decompiler cosmetics), leaving only real changes.
        - in: query
          name: format
          schema:
            type: string
            enum: [json, patch, git]
            default: json
          description: Use `patch`/`git` to return a git-like unified diff instead of JSON file summary.
      responses:
        "200":
          description: File additions, removals and hash-based modifications, or a git-like patch when requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileDiffResponse"
            text/x-diff:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/diff/patch:
    get:
      tags: [Diff]
      summary: Return a git-like unified source diff between two versions
      parameters:
        - in: query
          name: from
          required: true
          schema:
            type: string
        - in: query
          name: to
          required: true
          schema:
            type: string
        - in: query
          name: namespace
          schema:
            type: string
            enum: [yarn, mojmap]
            default: mojmap
        - in: query
          name: path
          schema:
            type: string
          description: Relative folder or file path prefix.
        - in: query
          name: file
          schema:
            type: string
          description: Exact or prefix source path filter. Takes precedence over `path`.
        - in: query
          name: function
          schema:
            type: string
          description: Optional method/function name filter, e.g. `Block#getDefaultState` or `getDefaultState`.
        - in: query
          name: context
          schema:
            type: integer
            minimum: 0
            maximum: 20
            default: 3
          description: Number of context lines per hunk.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50000
            default: 5000
          description: Maximum files included in the generated patch.
        - in: query
          name: ignoreWhitespace
          schema:
            type: boolean
            default: false
          description: >
            Collapse hunks that differ only in whitespace, line breaks or reindentation
            (decompiler cosmetics), leaving only real changes. A class with no semantic change
            yields an empty patch instead of a full-file rewrite.
        - in: query
          name: format
          schema:
            type: string
            enum: [patch, git, json]
            default: patch
          description: Raw patch by default; use `json` to include metadata and the patch string.
      responses:
        "200":
          description: Git-like unified diff generated from real source content.
          content:
            text/x-diff:
              schema:
                type: string
            application/json:
              schema:
                $ref: "#/components/schemas/PatchDiffResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/translate:
    get:
      tags: [Translation]
      summary: Translate a class, method or field name between namespaces
      parameters:
        - in: query
          name: name
          required: true
          schema:
            type: string
            minLength: 1
        - in: query
          name: from
          required: true
          schema:
            $ref: "#/components/schemas/LookupNamespace"
        - in: query
          name: to
          required: true
          schema:
            $ref: "#/components/schemas/LookupNamespace"
        - in: query
          name: version
          schema:
            type: string
          description: Defaults to the latest indexed release.
        - in: query
          name: type
          schema:
            type: string
            enum: [class, method, field, auto]
            default: auto
      responses:
        "200":
          description: Translation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranslateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/translate/{version}:
    post:
      tags: [Translation]
      summary: Translate a batch of class and member keys between namespaces
      description: >
        Takes the same keys as `/exists` — a class internal name, or `owner:name:descriptor` —
        spelled in `from`. `translated` is the whole key in `to`, descriptor included, so a result
        posts to `/exists/{version}` unchanged. Descriptors are translated type by type through the
        class table; a type the version does not know is left as it is. A key with no descriptor
        resolves only when the name has a single match.
      parameters:
        - $ref: "#/components/parameters/VersionPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchTranslateRequest"
      responses:
        "200":
          description: One result per key, in request order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchTranslateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: A requested namespace has no mappings on that version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/translate/class/{name}:
    get:
      tags: [Translation]
      summary: Translate a class name between namespaces
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
          description: Slash-separated internal name (`net/minecraft/Foo`) or dot-separated FQN (`net.minecraft.Foo`). Accepts catch-all path segments.
        - in: query
          name: from
          schema:
            $ref: "#/components/schemas/LookupNamespace"
        - in: query
          name: to
          schema:
            $ref: "#/components/schemas/LookupNamespace"
        - in: query
          name: version
          schema:
            type: string
      responses:
        "200":
          description: Class translation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranslateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/bytecode/{version}/{className}:
    get:
      tags: [Bytecode]
      summary: Disassemble a class from the configured Minecraft jar
      parameters:
        - $ref: "#/components/parameters/VersionPath"
        - in: path
          name: className
          required: true
          schema:
            type: string
          description: Slash-separated internal name (`net/minecraft/Foo`) or dot-separated FQN (`net.minecraft.Foo`). Accepts catch-all path segments.
        - in: query
          name: format
          schema:
            type: string
            enum: [json, text]
            default: json
          description: "`json` wraps the disassembly in an object; `text` returns raw text/plain."
        - in: query
          name: namespace
          schema:
            type: string
            enum: [yarn, mojmap, intermediary, obfuscated, obf]
            default: mojmap
      responses:
        "200":
          description: ASM Textifier output, wrapped in JSON or as raw text per `format`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BytecodeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/source/{version}/{className}:
    get:
      tags: [Bytecode]
      summary: Return decompiled source for a class
      description: >
        When `namespace` is omitted it defaults to `mojmap` and falls back to `yarn`
        for versions that have no mojmap source. An explicit `namespace` is used as-is.
        A name that matches no class exactly falls back to the one class of that version with the
        same simple name, which resolves both a bare simple name and a class that moved package.
        The `class` field of the response names the class actually served. An ambiguous or unknown
        simple name gives a `404` whose `message` lists the candidates.
      parameters:
        - $ref: "#/components/parameters/VersionPath"
        - in: path
          name: className
          required: true
          schema:
            type: string
          description: Slash-separated internal name (`net/minecraft/Foo`), dot-separated FQN (`net.minecraft.Foo`), or a bare simple name (`Foo`). Accepts catch-all path segments.
        - in: query
          name: namespace
          schema:
            type: string
            enum: [yarn, mojmap]
            default: mojmap
        - in: query
          name: format
          schema:
            type: string
            enum: [json, text]
            default: json
          description: "`json` returns the source in an object; `text` returns the raw `.java` as text/plain."
      responses:
        "200":
          description: Source code response, wrapped in JSON or as raw text per `format`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceResponse"
            text/plain:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/blame/{version}/{className}:
    get:
      tags: [Bytecode]
      summary: Version that last changed each line of a class source
      description: >
        One `git blame` over the source repository of the namespace. The class name resolves as it
        does for `/source`. `lines` holds one entry per line of the file, line 1 first, and each
        entry indexes `versions`. A version indexed from the artifact store alone has no source
        repository and gives a `404`.
      parameters:
        - $ref: "#/components/parameters/VersionPath"
        - in: path
          name: className
          required: true
          schema:
            type: string
          description: Slash-separated internal name (`net/minecraft/Foo`), dot-separated FQN (`net.minecraft.Foo`), or a bare simple name (`Foo`). Accepts catch-all path segments.
        - in: query
          name: namespace
          schema:
            type: string
            enum: [yarn, mojmap]
            default: mojmap
      responses:
        "200":
          description: Per-line attribution for the class source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlameResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/compare/{version}/{className}:
    get:
      tags: [Compare]
      summary: Yarn↔Mojmap member-correspondence table for a class
      description: >
        Returns the obf-keyed member table aligning a class across the Yarn and Mojmap namespaces,
        including members present in only one namespace. No source is read; this is a projection of
        the indexed mappings.
      parameters:
        - $ref: "#/components/parameters/VersionPath"
        - in: path
          name: className
          required: true
          schema:
            type: string
          description: Slash-separated class name in the `from` namespace. Catch-all path segments.
        - in: query
          name: from
          schema:
            $ref: "#/components/schemas/LookupNamespace"
          description: Namespace the class name is given in. Defaults to yarn.
        - in: query
          name: to
          schema:
            $ref: "#/components/schemas/LookupNamespace"
          description: The namespace to compare against. Defaults to mojmap.
      responses:
        "200":
          description: Class correspondence with a per-member table.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompareResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /api/v1/tokens/{version}/{className}:
    get:
      tags: [Bytecode]
      summary: Resolved identifier tokens for a decompiled class
      description: >
        Returns the decompiled source plus a token for every class/method/field identifier resolved
        to its owner/name/descriptor (via a symbol solver over the version's named jar). Ranges are
        Monaco-style 1-based; `endColumn` is exclusive. Identifiers the solver cannot resolve are
        omitted. Cached per (version, class, namespace) for the server's lifetime.
      parameters:
        - $ref: "#/components/parameters/VersionPath"
        - in: path
          name: className
          required: true
          schema:
            type: string
          description: Slash-separated internal name (`net/minecraft/Foo`) or dot-separated FQN (`net.minecraft.Foo`). Accepts catch-all path segments.
        - in: query
          name: namespace
          schema:
            type: string
            enum: [yarn, mojmap]
            default: mojmap
        - in: query
          name: format
          schema:
            type: string
            enum: [json, text]
            default: json
          description: >
            `json` returns `{source, tokens}`. `text` returns the tokens as text/plain TSV, one token
            per line, in the column order of the header line
            `#startLine startColumn endLine endColumn type className name descriptor declaration`.
      responses:
        "200":
          description: Source text plus resolved identifier tokens, as JSON or TSV per `format`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokensResponse"
            text/plain:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/history:
    get:
      tags: [History]
      summary: Track a class or member across every indexed version
      description: >
        Answers "which versions have this, and under what name?" from the mapping tables alone.
        Consecutive versions with the same answer collapse into one span, so a 500-version index
        returns a handful of entries. The class is followed by the intermediary name of its newest
        match rather than by the string queried, so a rename or a package move stays one history and
        the name from any version gives the same answer. Mojang's unobfuscated releases carry
        intermediary only when the indexer was given a separate source for them; without it a name
        taken from one of them is also looked up in the newest mapped version before it, by the
        simple name a package move preserves, and two names alive in the same version are never
        linked, as a class carries one name per version.
        Named descriptors are not indexed, so a signature change shows as a changed
        `intermediaryDescriptor`. A member the owner does not declare but inherits comes back
        `present: false` with `reason: "inherited"` and the declaring supertype in `declaredIn`, so
        telling "moved to a supertype" from "really gone" no longer needs a second call to
        `/exists`. Repeat `q` to follow several keys in one request.
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: array
            items:
              type: string
            maxItems: 50
          explode: true
          style: form
          description: >
            A class internal name (dot-separated FQN also accepted) or a member key `owner:name`.
            A third `:descriptor` segment is accepted for compatibility with `/references` and
            `/exists` keys but does not filter — overloads are returned together. Repeatable.
        - in: query
          name: namespace
          schema:
            type: string
            enum: [yarn, mojmap, intermediary]
            default: mojmap
        - in: query
          name: from
          schema:
            type: string
          description: >
            Limit the version walk. Either bound may be the older one. A bound may name a version
            the walk then skips, so bounding by a snapshot or by a variant works.
        - in: query
          name: to
          schema:
            type: string
        - in: query
          name: releasesOnly
          schema:
            type: boolean
            default: false
          description: >
            Walk releases alone. Snapshots between two releases split a span whenever a name moved
            and moved back, which makes the span list hard to read by eye.
        - $ref: "#/components/parameters/IncludeVariants"
      responses:
        "200":
          description: One entry per query, in the order given.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: "`from` or `to` names a version that is not indexed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/bodyhash:
    get:
      tags: [BodyHash]
      summary: Hash one method's body for each version of a range
      description: >
        Answers "did the behavior change between A and B", which `/diff/patch` cannot: that one
        works on decompiled source and reports the decompiler's own cosmetics as a change. The hash
        covers the instructions, the labels they jump to, the try/catch table and the frame sizes;
        ASM resolves the constant pool as it reads and `SKIP_DEBUG` drops line numbers and local
        variable names, so a recompile on its own does not move it. Consecutive versions that hash
        alike collapse into one span. A lambda body is a method of its own and is not followed, so a
        change confined to a lambda does not move the enclosing hash; the index in
        `lambda$name$12` is normalized away.
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: array
            items:
              type: string
            maxItems: 50
          explode: true
          style: form
          description: >
            `owner:name` or `owner:name:descriptor`. Without a descriptor every overload of the
            name hashes together, sorted, so the answer does not depend on declaration order.
            Repeatable.
        - in: query
          name: namespace
          schema:
            type: string
            enum: [yarn, mojmap]
            default: mojmap
          description: The hash is read from a named jar, and only these two have one.
        - in: query
          name: from
          required: true
          schema:
            type: string
        - in: query
          name: to
          required: true
          schema:
            type: string
        - in: query
          name: releasesOnly
          schema:
            type: boolean
            default: false
          description: >
            Walk releases alone. The 60-version cap is counted after the filters, so this is how a
            wide range is covered.
        - $ref: "#/components/parameters/IncludeVariants"
        - in: query
          name: normalize
          schema:
            type: string
            enum: [named, intermediary]
            default: named
          description: >
            `named` hashes the body as the namespace spells it, so a renamed callee moves the hash.
            `intermediary` renames the class types through intermediary first, so a class rename or
            a package move does not. Member names stay as the namespace spells them either way.
      responses:
        "200":
          description: One entry per query, in the order given.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BodyHashResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: "`from` or `to` names a version that is not indexed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/hierarchy/{version}/{className}:
    get:
      tags: [Hierarchy]
      summary: Inheritance hierarchy (supertypes and subtypes) of a class
      description: >
        Supertypes (walked up via super + interfaces) and subtypes (walked down) of a class, read from
        the version's named jar via ASM. `java/lang/Object` is omitted. Cached per (version, namespace).
      parameters:
        - $ref: "#/components/parameters/VersionPath"
        - in: path
          name: className
          required: true
          schema:
            type: string
          description: Slash-separated internal name (`net/minecraft/Foo`) or dot-separated FQN (`net.minecraft.Foo`). Accepts catch-all path segments.
        - in: query
          name: namespace
          schema:
            type: string
            enum: [yarn, mojmap]
            default: mojmap
      responses:
        "200":
          description: Nodes and parent→child edges of the hierarchy graph.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HierarchyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/diff/references:
    get:
      tags: [References]
      summary: How the sites using a class or member changed between two versions
      description: >
        Groups the sites that use `q` by the method they sit in, for both versions, and reports the
        difference. The question a mod update asks is not "does the signature still exist" but "is
        the call still where the mixin expects it": a call that moves from one method to another
        leaves every signature intact, so `/exists` reports nothing while the injection point breaks
        in silence. `moved` pairs a removed site with an added one when both reach exactly the same
        members. A class query answers for its members; class-level uses such as a cast carry no
        member to report, and a `new` shows through the constructor.
      parameters:
        - in: query
          name: from
          required: true
          schema:
            type: string
        - in: query
          name: to
          required: true
          schema:
            type: string
        - in: query
          name: q
          required: true
          schema:
            type: string
          description: "A class internal name, or a member key `owner:name:descriptor`."
        - in: query
          name: namespace
          schema:
            type: string
            enum: [yarn, mojmap]
            default: mojmap
      responses:
        "200":
          description: Added, removed and moved calling sites.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceDiffResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/references/{version}:
    get:
      tags: [References]
      summary: Find all references to classes or members
      description: >
        Every site referencing each target (`q`), found by scanning the version's named jar via ASM.
        Only references to Minecraft classes in the same jar are indexed; JDK/library targets are
        dropped. The reverse index is cached per (version, namespace) and served to every target of
        that version, so asking many targets of one version costs one scan. Descriptors here are in
        the requested namespace, so a key from this endpoint posts to `/exists` unchanged.
        Use the batch form for the `@At(target = ...)` half of a mixin: `/exists` covers the method
        injected into, and a signature can survive a version while a call inside its body moves
        elsewhere.
      parameters:
        - $ref: "#/components/parameters/VersionPath"
        - in: query
          name: q
          required: true
          schema:
            type: array
            items:
              type: string
            maxItems: 25
          explode: true
          style: form
          description: "Target key: a class internal name (`net/minecraft/.../Block`) or a member key `owner:name:descriptor`. Repeatable."
        - in: query
          name: namespace
          schema:
            type: string
            enum: [yarn, mojmap]
            default: mojmap
        - in: query
          name: to
          schema:
            type: string
          description: >
            The far end of a version range whose near end is `{version}`. Either bound may be the
            older one. Omit it to ask one version. The range itself is not capped; at most 25 of
            its versions may be ones the prebuilt reference index does not cover, since each of
            those costs a jar scan.
        - in: query
          name: releasesOnly
          schema:
            type: boolean
            default: false
          description: >
            Walk releases alone. The prebuilt reference index covers releases, so this walks the
            whole release line in one call. Without it, `1.21` to `26.2` is 137 versions, 121 of
            them uncovered, and is refused. Same meaning as on `/history`.
        - in: query
          name: depth
          schema:
            type: integer
            minimum: 1
            maximum: 5
            default: 1
          description: >
            Frames of the caller chain to walk. 1 answers "who calls this" and reports no paths;
            above 1 the response also carries `paths`, the chains that reach the target, outermost
            frame first and at most 200 of them.
        - $ref: "#/components/parameters/IncludeVariants"
      responses:
        "200":
          description: Referencing sites, one group per (version, target).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [References]
      summary: Find all references, with the targets in a body
      description: >
        The same call as `GET`, for batches a query string cannot hold. A request line above 4096
        bytes is rejected by the HTTP parser before it reaches the route, which caps `q` at about 33
        keys, so `GET` keeps its limit of 25 and this form takes up to 2000 targets, matching
        `/exists`. The `QUERY` method (RFC 10008) is accepted on this path as well, with the same
        body and the same answer; OpenAPI 3.1 has no field for it. Neither form is cached, because a
        URL-keyed cache cannot see the body.
      parameters:
        - $ref: "#/components/parameters/VersionPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferenceRequest"
      responses:
        "200":
          description: Referencing sites, one group per (version, target).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/exists/{version}:
    post:
      tags: [Exists]
      summary: Batch-check whether classes/members exist in a version
      description: >
        Validates a batch of class/member keys against a version's named jar (mojmap or yarn),
        returning one boolean per key. A key is a class internal name (`net/minecraft/.../ChunkMap`)
        or a member `owner:name:descriptor`. Descriptors are in the requested namespace. Intended
        for validating mixin/shadow targets when updating a mod to a new version.
      parameters:
        - $ref: "#/components/parameters/VersionPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExistsRequest"
      responses:
        "200":
          description: One existence result per requested key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExistsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/validate:
    post:
      tags: [Validate]
      summary: Check a set of mixin targets against every version of a range
      description: >
        The whole check a multi-version mod needs, as one request: does the hooked method still
        exist, did its signature change, and is the instruction the injection point names still
        inside the body. The last question is the one `/exists` cannot answer, because a call that
        moves out of the hooked method leaves every signature intact, so the mixin compiles, applies
        and does nothing.

        One entry for each target, one span for each run of versions that answers alike. A pair
        costs one read of one jar entry; only `call_moved` costs more, and only when the call left
        the class, which is when the reverse index is asked to pair the old calling site with a new
        one.
      parameters:
        - in: query
          name: from
          required: true
          schema:
            type: string
        - in: query
          name: to
          required: true
          schema:
            type: string
        - in: query
          name: releasesOnly
          schema:
            type: boolean
            default: false
          description: >
            Walk releases alone. The 60-version cap is counted after the filters, so this is how a
            wide range is covered.
        - $ref: "#/components/parameters/IncludeVariants"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateRequest"
      responses:
        "200":
          description: One entry per target, in the order given.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: "`from` or `to` names a version that is not indexed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /openapi.json:
    get:
      tags: [Docs]
      summary: OpenAPI specification
      responses:
        "200":
          description: OpenAPI 3.1 document.
          content:
            application/yaml:
              schema:
                type: string
  /openapi.yaml:
    get:
      tags: [Docs]
      summary: OpenAPI specification
      responses:
        "200":
          description: OpenAPI 3.1 document.
          content:
            application/yaml:
              schema:
                type: string
  /docs:
    get:
      tags: [Docs]
      summary: Swagger UI
      responses:
        "200":
          description: Swagger UI HTML.

components:
  parameters:
    VersionPath:
      in: path
      name: version
      required: true
      schema:
        type: string
    IncludeVariants:
      in: query
      name: includeVariants
      description: Include `<id>_unobfuscated` variants, which are hidden by default.
      schema:
        type: boolean
        default: false
  responses:
    BadRequest:
      description: Invalid request parameters.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Requested object was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unprocessable:
      description: The requested namespace is unavailable for this version.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    SearchType:
      type: string
      enum: [class, method, field, all]
      default: all
    SearchNamespace:
      type: string
      enum: [yarn, mojmap, intermediary, all]
      default: all
    MappingNamespace:
      type: string
      enum: [yarn, mojmap, intermediary]
      default: mojmap
    LookupNamespace:
      type: string
      enum: [yarn, mojmap, intermediary, obfuscated, obf]
    ApiError:
      type: object
      required: [error, message, status]
      properties:
        error:
          type: string
        message:
          type: string
        status:
          type: integer
    VersionInfo:
      type: object
      required: [id, releaseType, hasYarn, hasMojmap, hasIntermediary, classCount, methodCount, fieldCount, indexedAt]
      properties:
        id:
          type: string
        releaseType:
          type: string
        releaseTime:
          type: [string, "null"]
        protocolVersion:
          type: [integer, "null"]
          description: >
            Network protocol version, read from the `version.json` inside the Minecraft jar. Null for
            the versions published before that file existed (before 18w47b).
        hasYarn:
          type: boolean
        hasMojmap:
          type: boolean
          description: >
            True on Mojang's unobfuscated releases too. Those publish no mappings of their own, and
            the jar already carries the Mojang names, so the official namespace is the mojmap
            namespace and the two return the same name.
        hasIntermediary:
          type: boolean
          description: >
            True when the version carries intermediary names, not when a separate intermediary file
            exists. Yarn's merged tiny v2 is official->intermediary->named, so every yarn version
            has them. A Mojang unobfuscated release that yarn does not cover carries intermediary
            only when the indexer was given a separate source for it.
        variantOf:
          type: [string, "null"]
          description: >
            The build this version re-indexes from the pre-deobfuscated jar, or null when it stands
            on its own. A variant is left out of the listing, of the history walk and of the
            default-version choice unless asked for.
        classCount:
          type: integer
          format: int64
        methodCount:
          type: integer
          format: int64
        fieldCount:
          type: integer
          format: int64
        indexedAt:
          type: string
    VersionListResponse:
      type: object
      required: [versions]
      properties:
        versions:
          type: array
          items:
            $ref: "#/components/schemas/VersionInfo"
    ClassRef:
      type: object
      properties:
        intermediary:
          type: [string, "null"]
        yarn:
          type: [string, "null"]
        mojmap:
          type: [string, "null"]
        obfuscated:
          type: [string, "null"]
    SearchResultEntry:
      type: object
      required: [type, score]
      properties:
        type:
          type: string
          enum: [class, method, field]
        intermediary:
          type: [string, "null"]
        yarn:
          type: [string, "null"]
        mojmap:
          type: [string, "null"]
        obfuscated:
          type: [string, "null"]
        owner:
          anyOf:
            - $ref: "#/components/schemas/ClassRef"
            - type: "null"
        intermediaryDescriptor:
          type: [string, "null"]
          description: The descriptor as intermediary names it. Absent where the tiny files omit it.
        yarnDescriptor:
          type: [string, "null"]
          description: >
            The same descriptor as yarn spells it, derived from the official one through the
            classes of that version. This is what `/exists` matches on, so `{yarn}:{yarnDescriptor}`
            with `#` replaced by `:` is a key that needs no translation. Null when the row carries
            no yarn name.
        mojmapDescriptor:
          type: [string, "null"]
          description: The same, in mojmap. Null when the row carries no mojmap name.
        score:
          type: number
          description: >
            Match quality in `[0, 1)`, **higher is better**, which is the order `results` already
            comes back in. Derived from the FTS5 bm25 rank, so it compares results of one query and
            carries no meaning across queries.
        synthetic:
          type: boolean
          default: false
          description: >
            A javac lambda body (`lambda$addRecipes$0`), which the mappings name like any other
            method. Only present when `includeSynthetic=true` was asked for.
    SearchResponse:
      type: object
      required: [query, version, totalResults, results]
      properties:
        query:
          type: string
        version:
          type: string
        totalResults:
          type: integer
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResultEntry"
    TranslateInput:
      type: object
      required: [name, namespace]
      properties:
        name:
          type: string
        namespace:
          type: string
    TranslateOutput:
      type: object
      required: [namespace]
      properties:
        name:
          type: [string, "null"]
        namespace:
          type: string
    TranslateResponse:
      type: object
      required: [input, output, version, type]
      properties:
        input:
          $ref: "#/components/schemas/TranslateInput"
        output:
          $ref: "#/components/schemas/TranslateOutput"
        intermediary:
          type: [string, "null"]
        obfuscated:
          type: [string, "null"]
        version:
          type: string
        type:
          type: string
          enum: [class, method, field]
    DiffEntryItem:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [class, method, field]
        name:
          type: [string, "null"]
        intermediary:
          type: [string, "null"]
        owner:
          type: [string, "null"]
        intermediaryDescriptor:
          type: [string, "null"]
          description: The intermediary descriptor, as on SearchResultEntry.
        oldName:
          type: [string, "null"]
        newName:
          type: [string, "null"]
    DiffChanges:
      type: object
      required: [added, removed, renamed]
      properties:
        added:
          type: array
          items:
            $ref: "#/components/schemas/DiffEntryItem"
        removed:
          type: array
          items:
            $ref: "#/components/schemas/DiffEntryItem"
        renamed:
          type: array
          items:
            $ref: "#/components/schemas/DiffEntryItem"
    DiffSummary:
      type: object
      required:
        - classesAdded
        - classesRemoved
        - classesRenamed
        - methodsAdded
        - methodsRemoved
        - methodsRenamed
        - fieldsAdded
        - fieldsRemoved
        - fieldsRenamed
      properties:
        classesAdded: { type: integer }
        classesRemoved: { type: integer }
        classesRenamed: { type: integer }
        methodsAdded: { type: integer }
        methodsRemoved: { type: integer }
        methodsRenamed: { type: integer }
        fieldsAdded: { type: integer }
        fieldsRemoved: { type: integer }
        fieldsRenamed: { type: integer }
    DiffResponse:
      type: object
      required: [from, to, namespace, changes, summary]
      properties:
        from:
          type: string
        to:
          type: string
        namespace:
          type: string
        changes:
          $ref: "#/components/schemas/DiffChanges"
        summary:
          $ref: "#/components/schemas/DiffSummary"
    FileChange:
      type: object
      required: [path, methodsAdded, methodsRemoved, fieldsAdded, fieldsRemoved]
      properties:
        path:
          type: string
        methodsAdded:
          type: integer
        methodsRemoved:
          type: integer
        fieldsAdded:
          type: integer
        fieldsRemoved:
          type: integer
    FileDiff:
      type: object
      required: [added, removed, modified]
      properties:
        added:
          type: array
          items:
            type: string
        removed:
          type: array
          items:
            type: string
        modified:
          type: array
          items:
            $ref: "#/components/schemas/FileChange"
    FileDiffResponse:
      type: object
      required: [from, to, namespace, files]
      properties:
        from:
          type: string
        to:
          type: string
        namespace:
          type: string
        files:
          $ref: "#/components/schemas/FileDiff"
    PatchFileChange:
      type: object
      required: [path, changeType]
      properties:
        path:
          type: string
        changeType:
          type: string
          enum: [added, removed, modified]
    PatchDiffResponse:
      type: object
      required: [from, to, namespace, files, fileCount, truncated, patch]
      properties:
        from:
          type: string
        to:
          type: string
        namespace:
          type: string
          enum: [yarn, mojmap]
        path:
          type: [string, "null"]
        function:
          type: [string, "null"]
        files:
          type: array
          items:
            $ref: "#/components/schemas/PatchFileChange"
        fileCount:
          type: integer
        truncated:
          type: boolean
        patch:
          type: string
    BytecodeResponse:
      type: object
      required: [version, class, bytecode]
      properties:
        version:
          type: string
        class:
          type: string
        bytecode:
          type: string
    SourceResponse:
      type: object
      required: [version, class, namespace, source, path]
      properties:
        version:
          type: string
        class:
          type: string
        namespace:
          type: string
          enum: [yarn, mojmap]
        source:
          type: string
        path:
          type: string
    BlameResponse:
      type: object
      required: [version, class, namespace, path, versions, lines]
      properties:
        version:
          type: string
        class:
          type: string
        namespace:
          type: string
          enum: [yarn, mojmap]
        path:
          type: string
        versions:
          type: array
          description: Versions referenced by `lines`, each listed once.
          items:
            type: string
        lines:
          type: array
          description: Index into `versions` for each line of the file, line 1 first.
          items:
            type: integer
    CompareMember:
      type: object
      required: [kind, status]
      properties:
        kind:
          type: string
          enum: [method, field]
        obfName:
          type: [string, "null"]
        obfDesc:
          type: [string, "null"]
        intermediary:
          type: [string, "null"]
        yarn:
          type: [string, "null"]
        mojmap:
          type: [string, "null"]
        status:
          type: string
          enum: [matched, yarnOnly, mojmapOnly, unmappedYarn, synthetic, initializer, unmapped]
    CompareResponse:
      type: object
      required: [version, from, to, members]
      properties:
        version:
          type: string
        from:
          type: string
        to:
          type: string
        obf:
          type: [string, "null"]
        intermediary:
          type: [string, "null"]
        yarnClass:
          type: [string, "null"]
        mojmapClass:
          type: [string, "null"]
        presence:
          type: [string, "null"]
          enum: [both, yarn_only, mojmap_only, null]
        members:
          type: array
          items:
            $ref: "#/components/schemas/CompareMember"
    SourceToken:
      type: object
      required: [startLine, startColumn, endLine, endColumn, type, className, declaration]
      properties:
        startLine:
          type: integer
        startColumn:
          type: integer
        endLine:
          type: integer
        endColumn:
          type: integer
          description: Exclusive — one column past the last character (Monaco convention).
        type:
          type: string
          enum: [class, method, field]
        className:
          type: string
          description: Owner internal name (slashes for packages, `$` for nested classes), in the source namespace.
        name:
          type: [string, "null"]
          description: Member name; null for class tokens.
        descriptor:
          type: [string, "null"]
          description: JVM descriptor; null for class tokens.
        declaration:
          type: boolean
    TokensResponse:
      type: object
      required: [version, class, namespace, source, tokens]
      properties:
        version:
          type: string
        class:
          type: string
        namespace:
          type: string
          enum: [yarn, mojmap]
        source:
          type: string
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/SourceToken"
    HierarchyNode:
      type: object
      required: [name, simpleName, isInterface, isAbstract]
      properties:
        name:
          type: string
          description: Class internal name.
        simpleName:
          type: string
        isInterface:
          type: boolean
        isAbstract:
          type: boolean
    HierarchyEdge:
      type: object
      required: [parent, child]
      properties:
        parent:
          type: string
        child:
          type: string
    HierarchyResponse:
      type: object
      required: [version, namespace, root, nodes, edges]
      properties:
        version:
          type: string
        namespace:
          type: string
          enum: [yarn, mojmap]
        root:
          type: string
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/HierarchyNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/HierarchyEdge"
    ReferenceItem:
      type: object
      required: [owner, ownerSimple, kind]
      properties:
        owner:
          type: string
          description: Internal name of the referencing class.
        ownerSimple:
          type: string
        member:
          type: [string, "null"]
          description: Enclosing method name; null when the reference is in the class header.
        descriptor:
          type: [string, "null"]
        kind:
          type: string
          enum: [class, method, field]
        count:
          type: integer
          description: >
            Instructions in this site that hit the target. `@At(ordinal = N)` numbers them
            `0 .. count-1`, so a site with `count: 2` has two injection points, not one.
        synthetic:
          type: [string, "null"]
          description: >
            The javac lambda body the reference sits in (`lambda$tick$3`), when `member` names the
            method that lambda is written in. The lambda index moves between versions, so a mixin
            can only be written against the enclosing name.
    ReferenceRequest:
      type: object
      required: [targets]
      properties:
        namespace:
          type: string
          enum: [yarn, mojmap]
          default: mojmap
        targets:
          type: array
          maxItems: 2000
          items:
            type: string
          description: "Class internal names (`owner`) or member keys `owner:name:descriptor`."
        to:
          type: [string, "null"]
          description: The far end of a version range whose near end is the path's `{version}`.
        releasesOnly:
          type: boolean
          default: false
        includeVariants:
          type: boolean
          default: false
    ExistsRequest:
      type: object
      required: [members]
      properties:
        namespace:
          type: string
          enum: [yarn, mojmap]
          default: mojmap
        members:
          type: array
          maxItems: 2000
          items:
            type: string
          description: "Class internal names (`owner`) or member keys `owner:name:descriptor`."
    ExistsResult:
      type: object
      required: [key, exists]
      properties:
        key:
          type: string
        exists:
          type: boolean
        closest:
          type: [string, "null"]
          description: >
            The nearest declaration to a key that missed, in the same key form. Null when the version
            declares nothing of that name, and when `exists` is true.
        reason:
          type: [string, "null"]
          enum: [inherited, descriptor, kind, null]
          description: >
            Why `closest` is not the key asked for. `inherited`: a supertype declares this exact
            signature, so the call still resolves. `descriptor`: the owner declares this name under
            another descriptor of the same kind, so the signature changed. `kind`: the owner
            declares this name as a field where a method was asked for, or the other way round, so
            `closest` is not a drop-in replacement for the key. A method descriptor opens with `(`
            and a field descriptor does not.
        candidates:
          type: array
          description: >
            Every declaration under `owner:name`, in key form, for a key given without a descriptor.
            Such a key can never match, and a bare `exists: false` for it reads the same as a member
            that is really gone. One entry is the canonical resolution of `owner#name`, several are
            its overloads. Empty for a key that carries a descriptor, and for a class key. `closest`
            and `reason` are null whenever this is filled.
          items:
            type: string
    ExistsResponse:
      type: object
      required: [version, namespace, results]
      properties:
        version:
          type: string
        namespace:
          type: string
          enum: [yarn, mojmap]
        results:
          type: array
          items:
            $ref: "#/components/schemas/ExistsResult"
    HistoryMember:
      type: object
      description: One member matched in a span. Overloads share a name, so a span can hold several.
      properties:
        intermediary:
          type: [string, "null"]
        yarn:
          type: [string, "null"]
        mojmap:
          type: [string, "null"]
        intermediaryDescriptor:
          type: [string, "null"]
          description: Named descriptors are not indexed; this one answers whether the signature changed.
    HistorySpan:
      type: object
      description: A run of consecutive versions that answer the query identically.
      required: [from, to, versions, present]
      properties:
        from:
          type: string
          description: Oldest version of the run.
        to:
          type: string
          description: Newest version of the run.
        versions:
          type: integer
        present:
          type: boolean
        intermediary:
          type: [string, "null"]
          description: Class queries only.
        yarn:
          type: [string, "null"]
        mojmap:
          type: [string, "null"]
        owner:
          type: [string, "null"]
          description: >
            Member queries only: the owner class in the requested namespace. Set even when the
            member is absent, so a removed member (owner present) and a removed class (owner null)
            are distinguishable.
        members:
          type: array
          items:
            $ref: "#/components/schemas/HistoryMember"
        reason:
          type: [string, "null"]
          enum: [inherited, null]
          description: >
            Why the owner does not declare it, spelled as `/exists` spells it. `inherited` means a
            supertype declares it and the call still resolves, `declaredIn` names that supertype and
            `members` describes its declaration. A `present: false` span with no reason is a member
            that is really gone.
        declaredIn:
          type: [string, "null"]
          description: The supertype that declares it, in the requested namespace.
    HistoryEntry:
      type: object
      required: [query, type, spans]
      properties:
        query:
          type: string
          description: The requested key, echoed verbatim.
        type:
          type: string
          enum: [class, method, field, unknown]
        spans:
          type: array
          items:
            $ref: "#/components/schemas/HistorySpan"
    HistoryResponse:
      type: object
      required: [namespace, results]
      properties:
        namespace:
          type: string
          enum: [yarn, mojmap, intermediary]
        results:
          type: array
          items:
            $ref: "#/components/schemas/HistoryEntry"
    BodyHashSpan:
      type: object
      description: A run of consecutive versions whose method body hashes alike.
      required: [from, to, versions]
      properties:
        from:
          type: string
          description: Oldest version of the run.
        to:
          type: string
          description: Newest version of the run.
        versions:
          type: integer
        hash:
          type: [string, "null"]
          description: >
            16 hex characters of a SHA-256 over the normalized body. Null where the version has no
            such method, so a gap reads as a gap rather than as another body.
    BodyHashEntry:
      type: object
      required: [query, spans]
      properties:
        query:
          type: string
          description: The requested key, echoed verbatim.
        spans:
          type: array
          items:
            $ref: "#/components/schemas/BodyHashSpan"
    BodyHashResponse:
      type: object
      required: [namespace, normalize, results]
      properties:
        namespace:
          type: string
          enum: [yarn, mojmap]
        normalize:
          type: string
          enum: [named, intermediary]
        results:
          type: array
          items:
            $ref: "#/components/schemas/BodyHashEntry"
    ValidateAt:
      type: object
      description: Where the mixin injects, as `@At` spells it.
      required: [target]
      properties:
        value:
          type: string
          enum: [INVOKE, FIELD]
          default: INVOKE
          description: Both name one instruction, which is what makes them checkable here.
        target:
          type: string
          description: "The instruction's own target: `owner:name:descriptor`, in the requested namespace."
    ValidateTarget:
      type: object
      required: [id, owner, method]
      properties:
        id:
          type: string
          description: The caller's own label for this target, echoed back on the result.
        owner:
          type: string
        method:
          type: string
        descriptor:
          type: [string, "null"]
          description: Omit to follow every overload of the name.
        at:
          $ref: "#/components/schemas/ValidateAt"
    ValidateRequest:
      type: object
      required: [targets]
      properties:
        namespace:
          type: string
          enum: [yarn, mojmap]
          default: mojmap
          description: A target is checked against a named jar, and only these two have one.
        targets:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/ValidateTarget"
    ValidateSpan:
      type: object
      description: A run of consecutive versions that answer the same way about one target.
      required: [from, to, versions, status]
      properties:
        from:
          type: string
        to:
          type: string
        versions:
          type: integer
        status:
          type: string
          enum: [ok, renamed, inherited, call_moved, missing]
          description: >
            `ok` the method is there, and when `at` was given so is the instruction it names.
            `renamed` the name is there under another descriptor.
            `inherited` a supertype declares it, so the call resolves but the mixin does not apply.
            `call_moved` the method is there and the `at` instruction is not.
            `missing` neither the method nor a near declaration.
        atCount:
          type: [integer, "null"]
          description: >
            How many instructions of the body hit `at`, which is what `@At(ordinal = N)` numbers
            `0 .. atCount-1`. Only on `ok`, and only when `at` was given.
        closest:
          type: [string, "null"]
          description: The declaration to hook instead, in key form. On `renamed` and `inherited`.
        movedTo:
          type: [string, "null"]
          description: >
            `owner#method` that holds the call now, when it could be found. On `call_moved`, and on
            `missing` where the class still holds the call in exactly one other method, which is
            what a renamed method looks like from here.
    ValidateEntry:
      type: object
      required: [id, spans]
      properties:
        id:
          type: string
        spans:
          type: array
          items:
            $ref: "#/components/schemas/ValidateSpan"
    ValidateResponse:
      type: object
      required: [namespace, results]
      properties:
        namespace:
          type: string
          enum: [yarn, mojmap]
        results:
          type: array
          items:
            $ref: "#/components/schemas/ValidateEntry"
    BatchTranslateRequest:
      type: object
      required: [keys]
      properties:
        from:
          $ref: "#/components/schemas/LookupNamespace"
        to:
          $ref: "#/components/schemas/LookupNamespace"
        keys:
          type: array
          maxItems: 2000
          description: Class internal names, or `owner:name:descriptor` member keys, spelled in `from`.
          items:
            type: string
    BatchTranslateItem:
      type: object
      required: [key]
      properties:
        key:
          type: string
        translated:
          type: [string, "null"]
          description: >
            The same key in the `to` namespace, descriptor included, ready to post to
            `/exists/{version}`. Null when the version has no such class or member, and when an
            overloaded name was given without a descriptor.
        type:
          type: [string, "null"]
          enum: [class, method, field, null]
        intermediary:
          type: [string, "null"]
    BatchTranslateResponse:
      type: object
      required: [version, from, to, results]
      properties:
        version:
          type: string
        from:
          $ref: "#/components/schemas/LookupNamespace"
        to:
          $ref: "#/components/schemas/LookupNamespace"
        results:
          type: array
          items:
            $ref: "#/components/schemas/BatchTranslateItem"
    ReferenceGroup:
      type: object
      required: [version, query, references]
      properties:
        version:
          type: string
        query:
          type: string
        references:
          type: array
          items:
            $ref: "#/components/schemas/ReferenceItem"
        resolved:
          type: boolean
          default: true
          description: >
            Whether `query` could match this version's index at all. `false` means `references` is
            not an answer about the target: the key carries no descriptor and so can never match a
            `name:descriptor` index key, or its descriptor names no member the index knows, or the
            index holds no row for the owner. All three used to return an empty `references`, which
            is also what "nothing calls this" looks like. A key can resolve in one version of a range
            and not in the next, so this is per group, not per request.
        candidates:
          type: array
          description: >
            The keys `query` would match instead, when it did not resolve. One entry is the canonical
            resolution of `owner:name`, several are its overloads. Empty when `resolved` is true, and
            empty when the index holds no row for the owner.
          items:
            type: string
        paths:
          type: array
          description: >
            Caller chains reaching the target, outermost frame first. Empty unless `depth` was above
            1. Cycles are broken per chain, so a helper reached through several chains reports each.
          items:
            type: array
            items:
              $ref: "#/components/schemas/ReferenceItem"
    ReferenceSite:
      type: object
      required: [owner, ownerSimple, member, targets]
      properties:
        owner:
          type: string
        ownerSimple:
          type: string
        member:
          type: string
        targets:
          type: array
          items:
            type: string
          description: "The members of the query this site reaches, as `name:descriptor`."
    ReferenceMove:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
        to:
          type: string
    ReferenceDiffResponse:
      type: object
      required: [from, to, namespace, query, changes]
      properties:
        from:
          type: string
        to:
          type: string
        namespace:
          type: string
          enum: [yarn, mojmap]
        query:
          type: string
        changes:
          type: object
          required: [added, removed, moved]
          properties:
            added:
              type: array
              items:
                $ref: "#/components/schemas/ReferenceSite"
            removed:
              type: array
              items:
                $ref: "#/components/schemas/ReferenceSite"
            moved:
              type: array
              description: >
                Pairs from `removed` and `added` that reach exactly the same members, matched one to
                one by the same method name, then the same class, then a lone pair. An ambiguous
                group pairs nothing. A paired site also stays in the two lists above.
              items:
                $ref: "#/components/schemas/ReferenceMove"
    ReferenceResponse:
      type: object
      required: [namespace, results]
      properties:
        namespace:
          type: string
          enum: [yarn, mojmap]
        results:
          type: array
          description: One group per (version, target), versions oldest first and targets in request order.
          items:
            $ref: "#/components/schemas/ReferenceGroup"
