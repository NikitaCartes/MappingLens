      type: object
      required: [version, class, namespace, path, versions, lines]
      properties:
        version:
          type: string
        class:
          type: string
        namespace:
          type: string
          enum: [yarn, mojmap]
        path:
          type: string
        versions:
          type: array
          description: Versions referenced by `lines`, each listed once.
          items:
            type: string
        lines:
