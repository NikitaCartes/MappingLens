openapi: 3.1.0
info:
  title: MappingLens API
  description: Search, index, diff, translate and inspect Minecraft mappings across Yarn, Mojmap and Intermediary namespaces.
  version: 0.1.0
servers:
  - url: http://localhost:8080
tags:
  - name: Versions
  - name: Search
  - name: Diff
  - name: Translation
  - name: Bytecode
  - name: Compare
  - name: History
  - name: Hierarchy
  - name: References
  - name: Exists
  - name: Docs
paths:
  /api/v1/versions:
    get:
      tags: [Versions]
      summary: List all indexed versions
      responses:
        "200":
          description: Indexed versions with aggregate counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionListResponse"
  /api/v1/versions/{version}:
    get:
      tags: [Versions]
      summary: Get info about a specific indexed version
      parameters:
        - $ref: "#/components/parameters/VersionPath"
      responses:
        "200":
          description: Version metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/search:
    get:
      tags: [Search]
      summary: Search classes, methods and fields by mapping names
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            minLength: 1
        - in: query
          name: version
          schema:
            type: string
          description: Defaults to the latest indexed release.
        - in: query
          name: type
          schema:
            $ref: "#/components/schemas/SearchType"
          description: Element type filter.
        - in: query
          name: namespace
          schema:
            $ref: "#/components/schemas/SearchNamespace"
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: exact
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Search results ordered by FTS rank.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/diff:
    get:
      tags: [Diff]
      summary: Diff mappings between two versions
      parameters:
        - in: query
          name: from
          required: true
          schema:
            type: string
        - in: query
          name: to
          required: true
          schema:
            type: string
        - in: query
          name: namespace
          schema:
            $ref: "#/components/schemas/MappingNamespace"
        - in: query
          name: type
          schema:
            $ref: "#/components/schemas/SearchType"
        - in: query
          name: package
          schema:
            type: string
          description: Package/path prefix filter such as `net/minecraft/block`.
        - in: query
          name: class
          schema:
            type: string
          description: >
            Diff exactly one class (internal name in `namespace`, e.g.
            `net/minecraft/world/entity/Entity`), listing added/removed/renamed members by name.
            Unlike `package=` (a package-path prefix), this targets a single class; its summary
            counts match `/diff/files` for the same class. Takes precedence over `package`.
        - in: query
          name: changeType
          schema:
            type: string
            enum: [added, removed, renamed, all]
            default: all
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 100
      responses:
        "200":
          description: Added, removed and renamed mapping elements.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiffResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/diff/files:
    get:
      tags: [Diff]
      summary: Diff indexed source files between two versions
      parameters:
        - in: query
          name: from
          required: true
          schema:
            type: string
        - in: query
          name: to
          required: true
          schema:
            type: string
        - in: query
          name: namespace
          schema:
            type: string
            enum: [yarn, mojmap]
            default: mojmap
        - in: query
          name: path
          schema:
            type: string
          description: Relative source path prefix.
        - in: query
          name: file
          schema:
            type: string
          description: Exact or prefix source path filter. Takes precedence over `path`.
        - in: query
          name: function
          schema:
            type: string
          description: Optional method/function name filter used when `format=patch`.
        - in: query
          name: context
          schema:
            type: integer
            minimum: 0
            maximum: 20
            default: 3
          description: Number of context lines per hunk when `format=patch`.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50000
            default: 5000
          description: Maximum files included when `format=patch`.
        - in: query
          name: ignoreWhitespace
          schema:
            type: boolean
            default: false
          description: >
            When `format=patch`/`git`, collapse hunks that differ only in whitespace, line breaks
            or reindentation (decompiler cosmetics), leaving only real changes.
        - in: query
          name: format
          schema:
            type: string
            enum: [json, patch, git]
            default: json
          description: Use `patch`/`git` to return a git-like unified diff instead of JSON file summary.
      responses:
        "200":
          description: File additions, removals and hash-based modifications, or a git-like patch when requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileDiffResponse"
            text/x-diff:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/diff/patch:
    get:
      tags: [Diff]
      summary: Return a git-like unified source diff between two versions
      parameters:
        - in: query
          name: from
          required: true
          schema:
            type: string
        - in: query
          name: to
          required: true
          schema:
            type: string
        - in: query
          name: namespace
          schema:
            type: string
            enum: [yarn, mojmap]
            default: mojmap
        - in: query
          name: path
          schema:
            type: string
          description: Relative folder or file path prefix.
        - in: query
          name: file
          schema:
            type: string
          description: Exact or prefix source path filter. Takes precedence over `path`.
        - in: query
          name: function
          schema:
            type: string
          description: Optional method/function name filter, e.g. `Block#getDefaultState` or `getDefaultState`.
        - in: query
          name: context
          schema:
            type: integer
            minimum: 0
            maximum: 20
            default: 3
          description: Number of context lines per hunk.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50000
            default: 5000
          description: Maximum files included in the generated patch.
        - in: query
          name: ignoreWhitespace
          schema:
            type: boolean
            default: false
          description: >
            Collapse hunks that differ only in whitespace, line breaks or reindentation
            (decompiler cosmetics), leaving only real changes. A class with no semantic change
            yields an empty patch instead of a full-file rewrite.
        - in: query
          name: format
          schema:
            type: string
            enum: [patch, git, json]
            default: patch
          description: Raw patch by default; use `json` to include metadata and the patch string.
      responses:
        "200":
          description: Git-like unified diff generated from real source content.
          content:
            text/x-diff:
              schema:
                type: string
            application/json:
              schema:
                $ref: "#/components/schemas/PatchDiffResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/translate:
    get:
      tags: [Translation]
      summary: Translate a class, method or field name between namespaces
      parameters:
        - in: query
          name: name
          required: true
          schema:
            type: string
            minLength: 1
        - in: query
          name: from
          required: true
          schema:
            $ref: "#/components/schemas/LookupNamespace"
        - in: query
          name: to
          required: true
          schema:
            $ref: "#/components/schemas/LookupNamespace"
        - in: query
          name: version
          schema:
            type: string
          description: Defaults to the latest indexed release.
        - in: query
          name: type
          schema:
            type: string
            enum: [class, method, field, auto]
            default: auto
      responses:
        "200":
          description: Translation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranslateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/translate/class/{name}:
    get:
      tags: [Translation]
      summary: Translate a class name between namespaces
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
          description: Slash-separated internal name (`net/minecraft/Foo`) or dot-separated FQN (`net.minecraft.Foo`). Accepts catch-all path segments.
        - in: query
          name: from
          schema:
            $ref: "#/components/schemas/LookupNamespace"
        - in: query
          name: to
          schema:
            $ref: "#/components/schemas/LookupNamespace"
        - in: query
          name: version
          schema:
            type: string
      responses:
        "200":
          description: Class translation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranslateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/bytecode/{version}/{className}:
    get:
      tags: [Bytecode]
      summary: Disassemble a class from the configured Minecraft jar
      parameters:
        - $ref: "#/components/parameters/VersionPath"
        - in: path
          name: className
          required: true
          schema:
            type: string
          description: Slash-separated internal name (`net/minecraft/Foo`) or dot-separated FQN (`net.minecraft.Foo`). Accepts catch-all path segments.
        - in: query
          name: format
          schema:
            type: string
            enum: [json, text]
            default: json
          description: "`json` wraps the disassembly in an object; `text` returns raw text/plain."
        - in: query
          name: namespace
          schema:
            type: string
            enum: [yarn, mojmap, intermediary, obfuscated, obf]
            default: mojmap
      responses:
        "200":
          description: ASM Textifier output, wrapped in JSON or as raw text per `format`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BytecodeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/source/{version}/{className}:
    get:
      tags: [Bytecode]
      summary: Return decompiled source for a class
      description: >
        When `namespace` is omitted it defaults to `mojmap` and falls back to `yarn`
        for versions that have no mojmap source. An explicit `namespace` is used as-is.
        A name that matches no class exactly falls back to the one class of that version with the
        same simple name, which resolves both a bare simple name and a class that moved package.
        The `class` field of the response names the class actually served. An ambiguous or unknown
        simple name gives a `404` whose `message` lists the candidates.
      parameters:
        - $ref: "#/components/parameters/VersionPath"
        - in: path
          name: className
          required: true
          schema:
            type: string
          description: Slash-separated internal name (`net/minecraft/Foo`), dot-separated FQN (`net.minecraft.Foo`), or a bare simple name (`Foo`). Accepts catch-all path segments.
        - in: query
          name: namespace
          schema:
            type: string
            enum: [yarn, mojmap]
            default: mojmap
        - in: query
          name: format
          schema:
            type: string
            enum: [json, text]
            default: json
          description: "`json` returns the source in an object; `text` returns the raw `.java` as text/plain."
      responses:
        "200":
          description: Source code response, wrapped in JSON or as raw text per `format`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceResponse"
            text/plain:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/blame/{version}/{className}:
    get:
      tags: [Bytecode]
      summary: Version that last changed each line of a class source
      description: >
        One `git blame` over the source repository of the namespace. The class name resolves as it
        does for `/source`. `lines` holds one entry per line of the file, line 1 first, and each
        entry indexes `versions`. A version indexed from the artifact store alone has no source
        repository and gives a `404`.
      parameters:
        - $ref: "#/components/parameters/VersionPath"
        - in: path
          name: className
          required: true
          schema:
            type: string
          description: Slash-separated internal name (`net/minecraft/Foo`), dot-separated FQN (`net.minecraft.Foo`), or a bare simple name (`Foo`). Accepts catch-all path segments.
        - in: query
          name: namespace
          schema:
            type: string
            enum: [yarn, mojmap]
            default: mojmap
      responses:
        "200":
          description: Per-line attribution for the class source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlameResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/compare/{version}/{className}:
    get:
      tags: [Compare]
      summary: Yarn↔Mojmap member-correspondence table for a class
      description: >
        Returns the obf-keyed member table aligning a class across the Yarn and Mojmap namespaces,
        including members present in only one namespace. No source is read; this is a projection of
        the indexed mappings.
      parameters:
        - $ref: "#/components/parameters/VersionPath"
        - in: path
          name: className
          required: true
          schema:
            type: string
          description: Slash-separated class name in the `from` namespace. Catch-all path segments.
        - in: query
          name: from
          schema:
            $ref: "#/components/schemas/LookupNamespace"
          description: Namespace the class name is given in. Defaults to yarn.
        - in: query
          name: to
          schema:
            $ref: "#/components/schemas/LookupNamespace"
          description: The namespace to compare against. Defaults to mojmap.
      responses:
        "200":
          description: Class correspondence with a per-member table.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompareResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /api/v1/tokens/{version}/{className}:
    get:
      tags: [Bytecode]
      summary: Resolved identifier tokens for a decompiled class
      description: >
        Returns the decompiled source plus a token for every class/method/field identifier resolved
        to its owner/name/descriptor (via a symbol solver over the version's named jar). Ranges are
        Monaco-style 1-based; `endColumn` is exclusive. Identifiers the solver cannot resolve are
        omitted. Cached per (version, class, namespace) for the server's lifetime.
      parameters:
        - $ref: "#/components/parameters/VersionPath"
        - in: path
          name: className
          required: true
          schema:
            type: string
          description: Slash-separated internal name (`net/minecraft/Foo`) or dot-separated FQN (`net.minecraft.Foo`). Accepts catch-all path segments.
        - in: query
          name: namespace
          schema:
            type: string
            enum: [yarn, mojmap]
            default: mojmap
        - in: query
          name: format
          schema:
            type: string
            enum: [json, text]
            default: json
          description: >
            `json` returns `{source, tokens}`. `text` returns the tokens as text/plain TSV, one token
            per line, in the column order of the header line
            `#startLine startColumn endLine endColumn type className name descriptor declaration`.
      responses:
        "200":
          description: Source text plus resolved identifier tokens, as JSON or TSV per `format`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokensResponse"
            text/plain:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/history:
    get:
      tags: [History]
      summary: Track a class or member across every indexed version
      description: >
        Answers "which versions have this, and under what name?" from the mapping tables alone.
        Consecutive versions with the same answer collapse into one span, so a 500-version index
        returns a handful of entries. The class is followed by the intermediary name of its newest
        match rather than by the string queried, so a rename or a package move stays one history and
        the name from any version gives the same answer. Mojang's unobfuscated releases carry
        intermediary only when the indexer was given a separate source for them; without it a name
        taken from one of them is also looked up in the newest mapped version before it, by the
        simple name a package move preserves, and two names alive in the same version are never
        linked, as a class carries one name per version.
        Named descriptors are not indexed, so a signature change shows as a changed
        `intermediaryDescriptor`. Repeat `q` to follow several keys in one request.
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: array
            items:
              type: string
            maxItems: 50
          explode: true
          style: form
          description: >
            A class internal name (dot-separated FQN also accepted) or a member key `owner:name`.
            A third `:descriptor` segment is accepted for compatibility with `/references` and
            `/exists` keys but does not filter — overloads are returned together. Repeatable.
        - in: query
          name: namespace
          schema:
            type: string
            enum: [yarn, mojmap, intermediary]
            default: mojmap
        - in: query
          name: from
          schema:
            type: string
          description: Limit the version walk. Either bound may be the older one.
        - in: query
          name: to
          schema:
            type: string
      responses:
        "200":
          description: One entry per query, in the order given.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: "`from` or `to` names a version that is not indexed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/hierarchy/{version}/{className}:
    get:
      tags: [Hierarchy]
      summary: Inheritance hierarchy (supertypes and subtypes) of a class
      description: >
        Supertypes (walked up via super + interfaces) and subtypes (walked down) of a class, read from
        the version's named jar via ASM. `java/lang/Object` is omitted. Cached per (version, namespace).
      parameters:
        - $ref: "#/components/parameters/VersionPath"
        - in: path
          name: className
          required: true
          schema:
            type: string
          description: Slash-separated internal name (`net/minecraft/Foo`) or dot-separated FQN (`net.minecraft.Foo`). Accepts catch-all path segments.
        - in: query
          name: namespace
          schema:
            type: string
            enum: [yarn, mojmap]
            default: mojmap
      responses:
        "200":
          description: Nodes and parent→child edges of the hierarchy graph.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HierarchyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/references/{version}:
    get:
      tags: [References]
      summary: Find all references to a class or member
      description: >
        Every site referencing the target (`q`), found by scanning the version's named jar via ASM.
        Only references to Minecraft classes in the same jar are indexed; JDK/library targets are
        dropped. The reverse index is cached per (version, namespace).
      parameters:
        - $ref: "#/components/parameters/VersionPath"
        - in: query
          name: q
          required: true
          schema:
            type: string
          description: "Target key: a class internal name (`net/minecraft/.../Block`) or a member key `owner:name:descriptor`."
        - in: query
          name: namespace
          schema:
            type: string
            enum: [yarn, mojmap]
            default: mojmap
      responses:
        "200":
          description: Referencing sites for the target.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/exists/{version}:
    post:
      tags: [Exists]
      summary: Batch-check whether classes/members exist in a version
      description: >
        Validates a batch of class/member keys against a version's named jar (mojmap or yarn),
        returning one boolean per key. A key is a class internal name (`net/minecraft/.../ChunkMap`)
        or a member `owner:name:descriptor`. Descriptors are in the requested namespace. Intended
        for validating mixin/shadow targets when updating a mod to a new version.
      parameters:
        - $ref: "#/components/parameters/VersionPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExistsRequest"
      responses:
        "200":
          description: One existence result per requested key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExistsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /openapi.json:
    get:
      tags: [Docs]
      summary: OpenAPI specification
      responses:
        "200":
          description: OpenAPI 3.1 document.
          content:
            application/yaml:
              schema:
                type: string
  /openapi.yaml:
    get:
      tags: [Docs]
      summary: OpenAPI specification
      responses:
        "200":
          description: OpenAPI 3.1 document.
          content:
            application/yaml:
              schema:
                type: string
  /docs:
    get:
      tags: [Docs]
      summary: Swagger UI
      responses:
        "200":
          description: Swagger UI HTML.

components:
  parameters:
    VersionPath:
      in: path
      name: version
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request parameters.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Requested object was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unprocessable:
      description: The requested namespace is unavailable for this version.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    SearchType:
      type: string
      enum: [class, method, field, all]
      default: all
    SearchNamespace:
      type: string
      enum: [yarn, mojmap, intermediary, all]
      default: all
    MappingNamespace:
      type: string
      enum: [yarn, mojmap, intermediary]
      default: mojmap
    LookupNamespace:
      type: string
      enum: [yarn, mojmap, intermediary, obfuscated, obf]
    ApiError:
      type: object
      required: [error, message, status]
      properties:
        error:
          type: string
        message:
          type: string
        status:
          type: integer
    VersionInfo:
      type: object
      required: [id, releaseType, hasYarn, hasMojmap, hasIntermediary, classCount, methodCount, fieldCount, indexedAt]
      properties:
        id:
          type: string
        releaseType:
          type: string
        releaseTime:
          type: [string, "null"]
        protocolVersion:
          type: [integer, "null"]
        hasYarn:
          type: boolean
        hasMojmap:
          type: boolean
          description: >
            True on Mojang's unobfuscated releases too. Those publish no mappings of their own, and
            the jar already carries the Mojang names, so the official namespace is the mojmap
            namespace and the two return the same name.
        hasIntermediary:
          type: boolean
          description: >
            True when the version carries intermediary names, not when a separate intermediary file
            exists. Yarn's merged tiny v2 is official->intermediary->named, so every yarn version
            has them. A Mojang unobfuscated release that yarn does not cover carries intermediary
            only when the indexer was given a separate source for it.
        classCount:
          type: integer
          format: int64
        methodCount:
          type: integer
          format: int64
        fieldCount:
          type: integer
          format: int64
        indexedAt:
          type: string
    VersionListResponse:
      type: object
      required: [versions]
      properties:
        versions:
          type: array
          items:
            $ref: "#/components/schemas/VersionInfo"
    ClassRef:
      type: object
      properties:
        intermediary:
          type: [string, "null"]
