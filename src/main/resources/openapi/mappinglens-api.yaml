        obfDesc:
          type: [string, "null"]
        intermediary:
          type: [string, "null"]
        yarn:
          type: [string, "null"]
        mojmap:
          type: [string, "null"]
        status:
          type: string
          enum: [matched, yarnOnly, mojmapOnly, unmappedYarn, synthetic, initializer, unmapped]
    CompareResponse:
      type: object
      required: [version, from, to, members]
      properties:
        version:
          type: string
        from:
          type: string
        to:
          type: string
        obf:
          type: [string, "null"]
        intermediary:
          type: [string, "null"]
        yarnClass:
          type: [string, "null"]
        mojmapClass:
          type: [string, "null"]
        presence:
          type: [string, "null"]
          enum: [both, yarn_only, mojmap_only, null]
        members:
          type: array
          items:
            $ref: "#/components/schemas/CompareMember"
    SourceToken:
      type: object
      required: [startLine, startColumn, endLine, endColumn, type, className, declaration]
      properties:
        startLine:
          type: integer
        startColumn:
          type: integer
        endLine:
          type: integer
        endColumn:
          type: integer
          description: Exclusive — one column past the last character (Monaco convention).
        type:
          type: string
          enum: [class, method, field]
        className:
          type: string
          description: Owner internal name (slashes for packages, `$` for nested classes), in the source namespace.
        name:
          type: [string, "null"]
          description: Member name; null for class tokens.
        descriptor:
          type: [string, "null"]
          description: JVM descriptor; null for class tokens.
        declaration:
          type: boolean
    TokensResponse:
      type: object
      required: [version, class, namespace, source, tokens]
      properties:
        version:
          type: string
        class:
          type: string
        namespace:
          type: string
          enum: [yarn, mojmap]
        source:
          type: string
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/SourceToken"
    HierarchyNode:
      type: object
      required: [name, simpleName, isInterface, isAbstract]
      properties:
        name:
          type: string
          description: Class internal name.
        simpleName:
          type: string
        isInterface:
          type: boolean
        isAbstract:
          type: boolean
    HierarchyEdge:
      type: object
      required: [parent, child]
      properties:
        parent:
          type: string
        child:
          type: string
    HierarchyResponse:
      type: object
      required: [version, namespace, root, nodes, edges]
      properties:
        version:
          type: string
        namespace:
          type: string
          enum: [yarn, mojmap]
        root:
          type: string
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/HierarchyNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/HierarchyEdge"
    ReferenceItem:
      type: object
      required: [owner, ownerSimple, kind]
      properties:
        owner:
          type: string
          description: Internal name of the referencing class.
        ownerSimple:
          type: string
        member:
          type: [string, "null"]
          description: Enclosing method name; null when the reference is in the class header.
        descriptor:
          type: [string, "null"]
        kind:
          type: string
          enum: [class, method, field]
    ExistsRequest:
      type: object
      required: [members]
      properties:
        namespace:
          type: string
          enum: [yarn, mojmap]
          default: mojmap
        members:
          type: array
          maxItems: 2000
          items:
            type: string
          description: "Class internal names (`owner`) or member keys `owner:name:descriptor`."
    ExistsResult:
      type: object
      required: [key, exists]
      properties:
        key:
          type: string
        exists:
          type: boolean
        renamedTo:
          type: [string, "null"]
    ExistsResponse:
      type: object
      required: [version, namespace, results]
      properties:
        version:
          type: string
        namespace:
          type: string
          enum: [yarn, mojmap]
        results:
          type: array
          items:
            $ref: "#/components/schemas/ExistsResult"
    HistoryMember:
      type: object
      description: One member matched in a span. Overloads share a name, so a span can hold several.
      properties:
        intermediary:
          type: [string, "null"]
        yarn:
          type: [string, "null"]
        mojmap:
          type: [string, "null"]
        intermediaryDescriptor:
          type: [string, "null"]
          description: Named descriptors are not indexed; this one answers whether the signature changed.
    HistorySpan:
      type: object
      description: A run of consecutive versions that answer the query identically.
      required: [from, to, versions, present]
      properties:
        from:
          type: string
          description: Oldest version of the run.
        to:
          type: string
          description: Newest version of the run.
        versions:
          type: integer
        present:
          type: boolean
        intermediary:
          type: [string, "null"]
          description: Class queries only.
        yarn:
          type: [string, "null"]
        mojmap:
          type: [string, "null"]
        owner:
          type: [string, "null"]
          description: >
            Member queries only: the owner class in the requested namespace. Set even when the
            member is absent, so a removed member (owner present) and a removed class (owner null)
            are distinguishable.
        members:
          type: array
          items:
            $ref: "#/components/schemas/HistoryMember"
    HistoryEntry:
      type: object
      required: [query, type, spans]
      properties:
        query:
          type: string
          description: The requested key, echoed verbatim.
        type:
          type: string
          enum: [class, method, field, unknown]
        spans:
          type: array
          items:
            $ref: "#/components/schemas/HistorySpan"
    HistoryResponse:
      type: object
      required: [namespace, results]
      properties:
        namespace:
          type: string
          enum: [yarn, mojmap, intermediary]
        results:
          type: array
          items:
            $ref: "#/components/schemas/HistoryEntry"
    ReferenceResponse:
      type: object
      required: [version, namespace, query, references]
      properties:
        version:
          type: string
        namespace:
          type: string
          enum: [yarn, mojmap]
        query:
          type: string
        references:
          type: array
          items:
            $ref: "#/components/schemas/ReferenceItem"
