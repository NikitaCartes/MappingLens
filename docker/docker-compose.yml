# The compose file lives in docker/, so the project is named here rather than after the folder.
name: mappinglens

services:
  mappinglens:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    user: "1000:1000"
    environment:
      # The mappings to build and to index: "mojmap", "yarn" or both. Dropping one halves the
      # decompile and remap work, and leaves that namespace out of the index.
      MAPPINGS: mojmap yarn
      # true builds and indexes Mojang's stable releases alone: no snapshots, pre-releases, release
      # candidates, April Fools versions, combat snapshots or _unobfuscated variants. On the store
      # measured from 1.14 to 26.2 that is 47 versions of 526, and about a tenth of the index rows.
      ONLY_RELEASES: "false"
      # Scope of the prebuilt reverse-reference index: "all", "releases" or "none". Every version
      # costs 10.3 GB and 11 minutes on a full store, the releases alone 1.0 GB and 57 seconds. An
      # uncovered version still answers /references, by scanning its named jar: 770ms against 27ms.
      REFS: all
      UPDATE_INTERVAL_SECONDS: 3600
      # GitCraft's forked run JVM does the decompile and remap work.
      GITCRAFT_JAVA_OPTS: -Xmx16g
      # The index command processes one version per run no matter how many versions are targeted.
      # Heap needs do not grow with the version count.
      INDEX_JAVA_OPTS: -Xmx4g
      # Serve keeps a cache per class and version for the life of the process
      SERVE_JAVA_OPTS: -Xmx4g
    volumes:
      - /path/to/data:/data
      # An existing GitCraft store can be mounted over the matching subdirectory, which skips the
      # first build (a full build from an empty volume takes a long time). The layout under /data is:
      #   /data/artifact-store  GitCraft artifact store (mappings, mc-versions, decompiled, ...)
      #   /data/repos/yarn      decompiled sources, yarn
      #   /data/repos/mojmap    decompiled sources, mojmap
      #   /data/index           mappinglens.db, mappinglens-search.db and mappinglens-refs.db
      #   /data/state           update markers
      #   /data/gradle          gradle home for the GitCraft runs
      # - /path/to/artifact-store:/data/artifact-store
    restart: unless-stopped

  # The static bundle plus the nginx that proxies /api to the service above.
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - mappinglens
    restart: unless-stopped
