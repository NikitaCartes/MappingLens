server {
    listen 80;
    root /usr/share/nginx/html;

    # The bundle calls the API on its own origin (`/api/v1/...`), so the path is proxied to the
    # `mappinglens` service of the compose file. The application has no client-side routes,
    # so no index.html fallback is needed.
    location /api/ {
        proxy_pass http://mappinglens:8080;
        # A first reference scan or bytecode read walks a whole Minecraft jar.
        proxy_read_timeout 300s;
    }

    # The Monaco editor makes the bundle a few megabytes. nginx names .js text/javascript since
    # 1.25 and application/javascript before, so both are listed.
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json;
}
